name: Build & Release Electron App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
            artifact: OzgecmisAsistani-win32-x64
          - os: macos-latest
            platform: darwin
            arch: x64
            artifact: OzgecmisAsistani-darwin-x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
            artifact: OzgecmisAsistani-linux-x64

    defaults:
      run:
        working-directory: electron-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: electron-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Package application
        run: npx @electron/packager . "OzgecmisAsistani" --platform=${{ matrix.platform }} --arch=${{ matrix.arch }} --out=dist --overwrite --app-version=${{ github.ref_name != '' && github.ref_name || '4.0.0' }}

      - name: Archive (Windows)
        if: matrix.platform == 'win32'
        shell: pwsh
        run: Compress-Archive -Path dist/${{ matrix.artifact }}/* -DestinationPath dist/${{ matrix.artifact }}.zip

      - name: Archive (macOS)
        if: matrix.platform == 'darwin'
        run: cd dist && zip -r ${{ matrix.artifact }}.zip ${{ matrix.artifact }}

      - name: Archive (Linux)
        if: matrix.platform == 'linux'
        run: cd dist && tar czf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            electron-app/dist/${{ matrix.artifact }}.zip
            electron-app/dist/${{ matrix.artifact }}.tar.gz
          if-no-files-found: ignore

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            electron-app/dist/${{ matrix.artifact }}.zip
            electron-app/dist/${{ matrix.artifact }}.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
