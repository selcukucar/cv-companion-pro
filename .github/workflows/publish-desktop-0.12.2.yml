name: Publish Windows preview 0.12.2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-desktop-0.12.2.yml']
permissions:
  contents: write
concurrency:
  group: desktop-v0.12.2
jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build Windows packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (!$compiler) {
            $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          }
          if (!(Test-Path -LiteralPath $compiler)) { throw 'Inno Setup compiler not found.' }
          # Inno Setup 6 produces an x86 installer by default.
          $installer = Join-Path $PWD 'installer.iss'
          $content = [IO.File]::ReadAllText($installer) -replace '(?m)^SetupArchitecture=x86\r?\n', ''
          [IO.File]::WriteAllText($installer, $content, [Text.UTF8Encoding]::new($true))
          .\Package.ps1 -InnoCompiler $compiler -OutputDirectory .\dist
          $names = 'OzgecmisAsistani-0.12.2-setup.exe','OzgecmisAsistani-0.12.2-portable.zip'
          $checksums = foreach ($name in $names) {
            $file = Join-Path 'dist' $name
            "$((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant())  $name"
          }
          [IO.File]::WriteAllLines((Join-Path $PWD 'dist\OzgecmisAsistani-0.12.2-SHA256.txt'), [string[]]$checksums, [Text.Encoding]::ASCII)
      - name: Publish preview
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & gh release view desktop-v0.12.2 --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { exit 0 }
          $notes = @'
          Windows 10 ve 11 için Türkçe ve İngilizce önizleme. Klavye ve ekran okuyucu odaklı CV düzenleme, yerel taslaklar, Word ve etiketli PDF dışa aktarma.

          - Kurulum EXE'sini veya portable ZIP'i indirin. Portable sürümde ZIP'in tamamını yazılabilir bir klasöre çıkarın.
          - .NET Framework 4.8 veya 4.8.1 gerekir.
          - Uygulama ve kurulum imzasızdır. Windows SmartScreen uyarı gösterebilir. SHA-256 özetleri sürüme eklenmiştir.
          - Yardım menüsündeki geri bildirim formu e-posta taslağı açar.
          '@
          $notesPath = Join-Path $env:RUNNER_TEMP 'desktop-v0.12.2-notes.md'
          [IO.File]::WriteAllText($notesPath, $notes)
          $assets = @(Get-ChildItem -LiteralPath dist -File | Select-Object -ExpandProperty FullName)
          & gh release create desktop-v0.12.2 @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Öz Geçmiş Asistanı 0.12.2 Önizleme' --notes-file $notesPath --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }
