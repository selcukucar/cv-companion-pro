name: Publish Windows preview 0.12.4
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-desktop-0.12.4.yml', 'installer.iss']
permissions:
  contents: write
concurrency:
  group: desktop-v0.12.4
jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build Windows packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (!$compiler) {
            $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          }
          if (!(Test-Path -LiteralPath $compiler)) { throw 'Inno Setup compiler not found.' }
          # Inno Setup 6 produces an x86 installer by default.
          $installer = Join-Path $PWD 'installer.iss'
          $content = [IO.File]::ReadAllText($installer) -replace '(?m)^SetupArchitecture=x86\r?\n', ''
          [IO.File]::WriteAllText($installer, $content, [Text.UTF8Encoding]::new($true))
          .\Package.ps1 -InnoCompiler $compiler -OutputDirectory .\dist
          $names = 'OzgecmisAsistani-0.12.4-setup.exe','OzgecmisAsistani-0.12.4-portable.zip'
          $checksums = foreach ($name in $names) {
            $file = Join-Path 'dist' $name
            "$((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant())  $name"
          }
          [IO.File]::WriteAllLines((Join-Path $PWD 'dist\OzgecmisAsistani-0.12.4-SHA256.txt'), [string[]]$checksums, [Text.Encoding]::ASCII)
      - name: Verify fresh installation and upgrade
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'cv-assistant-install-test'
          $install = Join-Path $root 'Installed'
          $profile = Join-Path $env:LOCALAPPDATA 'OzgecmisAsistaniDesktop'
          $library = Join-Path $profile 'taslaklar.json'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          if (Test-Path -LiteralPath $profile) { throw 'Expected a clean test profile.' }
          gh release download desktop-v0.12.2 --repo $env:GITHUB_REPOSITORY --dir $root --pattern '*-setup.exe' --pattern '*-portable.zip'
          if ($LASTEXITCODE -ne 0) { throw 'Previous release download failed.' }
          foreach ($archive in @((Join-Path $root 'OzgecmisAsistani-0.12.2-portable.zip'), (Join-Path $PWD 'dist\OzgecmisAsistani-0.12.4-portable.zip'))) {
            $zip = [IO.Compression.ZipFile]::OpenRead($archive)
            try {
              if ($zip.Entries | Where-Object FullName -match '(?i)(^|[/\\])(Data|taslaklar[^/\\]*\.json|ai-keys\.dat)([/\\]|$)') {
                throw 'A portable package contains user data.'
              }
            } finally { $zip.Dispose() }
          }
          function Invoke-Setup($exe) {
            $log = Join-Path $root 'installer.log'
            Write-Host "Installing $(Split-Path -Leaf $exe)"
            $run = Start-Process -FilePath $exe -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=`"$log`"","/DIR=`"$install`"") -WindowStyle Hidden -Wait -PassThru
            if ($run.ExitCode -ne 0) {
              if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 35 }
              reg query 'HKLM\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Full' /v Release /reg:32
              reg query 'HKLM\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Full' /v Release /reg:64
              throw "Setup failed with exit code $($run.ExitCode)."
            }
          }
          Invoke-Setup (Join-Path $root 'OzgecmisAsistani-0.12.2-setup.exe')
          if ((Test-Path -LiteralPath $library) -or (Get-ChildItem -LiteralPath $install -Recurse -File | Where-Object Name -match 'taslaklar|ai-keys')) {
            throw 'The previous installer contains user data.'
          }
          New-Item -ItemType Directory -Path $profile -Force | Out-Null
          $sample = '{"active":0,"drafts":[{"name":"Synthetic test","data":{"form":{"name":"Test Person","title":"Test title"}}}]}'
          [IO.File]::WriteAllText($library, $sample)
          $setup = (Resolve-Path -LiteralPath 'dist\OzgecmisAsistani-0.12.4-setup.exe').Path
          Invoke-Setup $setup
          if (!(Test-Path -LiteralPath $library) -or [IO.File]::ReadAllText($library) -ne $sample) {
            throw 'Upgrade did not preserve the original draft.'
          }
          $uninstaller = Get-ChildItem -LiteralPath $install -Filter 'unins*.exe' | Select-Object -First 1
          $run = Start-Process -FilePath $uninstaller.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -WindowStyle Hidden -Wait -PassThru
          if ($run.ExitCode -ne 0 -or !(Test-Path -LiteralPath $library)) { throw 'Uninstall did not preserve local drafts.' }
          Invoke-Setup $setup
          if (Test-Path -LiteralPath $library) { throw 'Fresh reinstall would still open the old draft.' }
          $archived = Get-ChildItem -LiteralPath $profile -Filter 'taslaklar-onceki-*.json'
          if (@($archived).Count -ne 1 -or [IO.File]::ReadAllText($archived.FullName) -ne $sample) {
            throw 'Fresh reinstall did not safely archive the draft.'
          }
      - name: Publish preview
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & gh release view desktop-v0.12.4 --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { exit 0 }
          $notes = @'
          Windows 10 ve 11 için Türkçe ve İngilizce önizleme. Klavye ve ekran okuyucu odaklı CV düzenleme, yerel taslaklar, Word ve etiketli PDF dışa aktarma.

          - Kurulum EXE'sini veya portable ZIP'i indirin. Portable sürümde ZIP'in tamamını yazılabilir bir klasöre çıkarın.
          - .NET Framework 4.8 veya 4.8.1 gerekir.
          - Uygulama ve kurulum imzasızdır. Windows SmartScreen uyarı gösterebilir. SHA-256 özetleri sürüme eklenmiştir.
          - Temiz kurulum boş taslakla açılır. Eski yerel taslaklar silinmeden arşivlenir. Mevcut kurulum üzerine güncelleme taslakları korur.
          '@
          $notesPath = Join-Path $env:RUNNER_TEMP 'desktop-v0.12.4-notes.md'
          [IO.File]::WriteAllText($notesPath, $notes)
          $assets = @(Get-ChildItem -LiteralPath dist -File | Select-Object -ExpandProperty FullName)
          & gh release create desktop-v0.12.4 @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Öz Geçmiş Asistanı 0.12.4 Önizleme' --notes-file $notesPath --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }
